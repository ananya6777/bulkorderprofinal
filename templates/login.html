<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>BulkOrder Pro — Login</title>

    <!-- Change style.css to login.css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">

</head>

<body>

<div class="login-container">

    <div class="window">

        <div class="title-bar">

            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="url-pill">
                bulkorderpro.app
            </div>

        </div>


        <form class="login-box" method="POST" action="{{ url_for('login') }}">

            <h1 class="brand-title">
                BulkOrder Pro
            </h1>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <select
                name="role"
                required>

                <option value="" disabled selected>
                    Select Role
                </option>

                <option value="manager">
                    Manager
                </option>

                <option value="staff">
                    Staff
                </option>

            </select>

            <button type="submit">
                LOGIN
            </button>

        </form>

    </div>

</div>

</body>
</html>
