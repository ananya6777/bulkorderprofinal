<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BulkOrder Pro Customer Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='customer_account.css') }}">
</head>

<body>

    <div class="account-page">

        <div class="account-card">

            <h1>BulkOrder Pro</h1>

            <h2>Customer Login</h2>

            <p>
                Login to place and track your bulk orders.
            </p>

            {% if error %}

            <p class="error-message">
                {{ error }}
            </p>

            {% endif %}

            <form
                method="POST"
                action="{{ url_for('customer_login') }}">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    required>


                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    required>


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="account-link">
                Don't have an account?

                <a href="{{ url_for('customer_register_page') }}">
                    Register
                </a>
            </p>

        </div>

    </div>

</body>

</html>
